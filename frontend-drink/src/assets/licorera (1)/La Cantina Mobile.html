<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>La Cantina — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bone:#faf7f2;
    --bone-2:#f1ece2;
    --ink:#12100f;
    --ink-2:#2a2522;
    --ink-3:#5a514c;
    --ink-4:#8a807a;
    --wine:#6b1520;
    --wine-2:#8f2230;
    --wine-3:#4a0d16;
    --wine-wash:#f3e6e8;
    --line: rgba(18,16,15,.1);
    --line-2: rgba(18,16,15,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#e8e3d8;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    padding:40px 24px 80px;
    min-height:100vh;
  }
  .serif{font-family:'Playfair Display', Georgia, serif}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
  a{color:inherit;text-decoration:none}
  input{font-family:inherit;color:inherit}

  /* ===== Canvas header ===== */
  .canvas-head{
    max-width:1600px;margin:0 auto 48px;text-align:center;
  }
  .canvas-head .eye{
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--wine);margin-bottom:12px;
  }
  .canvas-head h1{
    font-family:'Playfair Display', serif;
    font-size:48px;line-height:1;margin:0 0 12px;font-weight:700;letter-spacing:-.02em;
  }
  .canvas-head h1 em{color:var(--wine);font-weight:500}
  .canvas-head p{color:var(--ink-3);margin:0;font-size:14px;max-width:560px;margin:0 auto}

  /* ===== Tabs for options ===== */
  .opt-tabs{
    display:flex;gap:8px;justify-content:center;margin:32px 0 44px;
  }
  .opt-tab{
    padding:12px 22px;border-radius:999px;border:1px solid var(--line);
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    background:#fff;color:var(--ink-3);
    transition:.15s all;
  }
  .opt-tab.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
  .opt-tab:hover{border-color:var(--ink)}

  /* ===== Screens lab ===== */
  .lab{
    max-width:1600px;margin:0 auto;
    display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:48px 32px;
    justify-items:center;
  }
  .phone-wrap{
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }
  .phone-label{
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);
    font-weight:600;
  }

  /* ===== iOS frame ===== */
  .ios{
    width:320px;height:648px;border-radius:44px;
    background:#0a0807;padding:9px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.15);
    position:relative;
  }
  .ios-screen{
    width:100%;height:100%;border-radius:36px;
    background:var(--bone);overflow:hidden;position:relative;
    display:flex;flex-direction:column;
  }
  .ios-island{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:92px;height:27px;background:#000;border-radius:20px;z-index:20;
  }
  .ios-home{
    position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
    width:108px;height:4px;background:rgba(0,0,0,.25);border-radius:4px;z-index:60;pointer-events:none;
  }
  .ios.dark .ios-home{background:rgba(255,255,255,.6)}
  .status-bar{
    height:44px;padding:15px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;
    position:relative;z-index:10;flex-shrink:0;
  }
  .status-bar .time{font-size:14px;font-weight:600;letter-spacing:-.2px}
  .status-bar .icons{display:flex;gap:5px;align-items:center}
  .sb-signal{display:flex;gap:1.5px;align-items:flex-end}
  .sb-signal i{width:3px;background:currentColor;border-radius:1px}
  .sb-signal i:nth-child(1){height:4px}
  .sb-signal i:nth-child(2){height:6px}
  .sb-signal i:nth-child(3){height:8px}
  .sb-signal i:nth-child(4){height:10px}
  .sb-battery{
    width:22px;height:10px;border:1px solid currentColor;border-radius:2.5px;
    padding:1px;position:relative;
  }
  .sb-battery::after{content:"";position:absolute;right:-3px;top:3px;width:1.5px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
  .sb-battery i{display:block;height:100%;width:75%;background:currentColor;border-radius:1px}

  /* ===== Android frame ===== */
  .android{
    width:320px;height:648px;border-radius:28px;
    background:#1a1a1a;padding:5px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.15);
  }
  .android-screen{
    width:100%;height:100%;border-radius:24px;
    background:var(--bone);overflow:hidden;position:relative;
    display:flex;flex-direction:column;
  }
  .android .status-bar{height:32px;padding:9px 16px 0;font-size:13px}
  .android .status-bar .time{font-weight:500}
  .android-camera{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:8px;height:8px;border-radius:50%;background:#000;z-index:20;
  }
  .android-nav-bar{
    height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .android-nav-bar i{
    width:90px;height:3px;background:rgba(0,0,0,.35);border-radius:3px;
  }

  /* ===== Screen body ===== */
  .screen-body{
    flex:1;overflow:hidden;position:relative;
    display:flex;flex-direction:column;
  }
  .scroll{
    flex:1;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .scroll::-webkit-scrollbar{display:none}

  /* ===== Common UI primitives ===== */
  .app-header{
    padding:10px 16px 14px;display:flex;align-items:center;gap:10px;
    background:var(--bone);border-bottom:1px solid var(--line-2);
    flex-shrink:0;
  }
  .hamburger{
    width:36px;height:36px;border-radius:10px;background:var(--bone-2);
    display:grid;place-items:center;
  }
  .hamburger svg{width:16px;height:16px}
  .app-brand{
    font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:-.01em;
    line-height:1;display:flex;flex-direction:column;gap:2px;
  }
  .app-brand em{color:var(--wine);font-style:italic;font-weight:500}
  .app-brand small{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-4);font-family:'Inter',sans-serif;font-weight:500}
  .app-header-right{margin-left:auto;display:flex;gap:6px}
  .hdr-icon{
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    color:var(--ink);position:relative;
  }
  .hdr-icon.primary{background:var(--wine);color:var(--bone)}
  .hdr-icon svg{width:16px;height:16px}
  .hdr-icon .pip{
    position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;
    background:var(--wine);color:var(--bone);border-radius:50%;
    font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 4px;
    border:2px solid var(--bone);
  }
  .hdr-icon.primary .pip{background:var(--ink);border-color:var(--wine)}

  /* ===== Tab bar ===== */
  .tabbar{
    height:62px;background:var(--bone);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);flex-shrink:0;
    padding-bottom:4px;
  }
  .tabbar button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--ink-4);position:relative;
  }
  .tabbar button.on{color:var(--wine)}
  .tabbar button svg{width:19px;height:19px}
  .tabbar button span{font-size:9.5px;font-weight:500;letter-spacing:.03em}
  .tabbar button.on::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:22px;height:2.5px;background:var(--wine);border-radius:0 0 3px 3px;
  }

  /* ===== HOME ===== */
  .hero-card{
    margin:12px 14px 18px;border-radius:16px;
    background:linear-gradient(135deg,var(--wine-3),var(--wine));
    color:var(--bone);padding:20px 18px;
    position:relative;overflow:hidden;
  }
  .hero-card::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(-30deg, rgba(255,255,255,.06) 0 2px, transparent 2px 12px);
    opacity:.6;
  }
  .hero-card .eye{font-size:9px;letter-spacing:.24em;text-transform:uppercase;opacity:.7;margin-bottom:8px;position:relative}
  .hero-card h2{
    font-family:'Playfair Display',serif;font-size:24px;line-height:1.05;margin:0 0 10px;
    font-weight:700;letter-spacing:-.01em;position:relative;
  }
  .hero-card h2 em{font-style:italic;font-weight:500;color:#e8c5cb}
  .hero-card p{font-size:12px;margin:0 0 16px;opacity:.8;position:relative;line-height:1.4;max-width:180px}
  .hero-card .cta{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bone);color:var(--ink);
    padding:9px 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.06em;
    position:relative;
  }
  .hero-card .bottle-deco{
    position:absolute;right:-10px;top:50%;transform:translateY(-50%);
    width:90px;height:180px;border-radius:40% 40% 8px 8px / 8% 8% 8px 8px;
    background:linear-gradient(180deg,#0a0204,#1a0308 60%,#0a0204);
    box-shadow:inset -12px 0 22px rgba(0,0,0,.5);
    opacity:.9;
  }
  .hero-card .bottle-deco::before{
    content:"";position:absolute;left:50%;top:-22px;transform:translateX(-50%);
    width:28px;height:32px;background:#000;border-radius:3px 3px 0 0;
  }
  .hero-card .bottle-deco::after{
    content:"LC";position:absolute;left:10px;right:10px;top:55px;bottom:20px;
    background:var(--bone);color:var(--wine);border-radius:3px;
    display:grid;place-items:center;
    font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:18px;
  }

  .section-head{
    padding:6px 16px 12px;display:flex;justify-content:space-between;align-items:baseline;
  }
  .section-head h3{
    font-family:'Playfair Display',serif;font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em;
  }
  .section-head h3 em{color:var(--wine);font-style:italic;font-weight:500}
  .section-head a{font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;font-weight:500}

  /* horizontal scroller */
  .h-scroll{
    display:flex;gap:10px;overflow-x:auto;padding:0 16px 18px;
    scroll-snap-type:x mandatory;
  }
  .h-scroll::-webkit-scrollbar{display:none}
  .cat-pill{
    flex-shrink:0;scroll-snap-align:start;
    padding:9px 16px;border-radius:999px;border:1px solid var(--line);
    font-size:12px;font-weight:500;white-space:nowrap;
    background:#fff;color:var(--ink-2);
  }
  .cat-pill.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
  .cat-pill.wine{background:var(--wine);color:var(--bone);border-color:var(--wine)}

  /* Stories / banners */
  .stories{display:flex;gap:10px;overflow-x:auto;padding:6px 16px 14px}
  .stories::-webkit-scrollbar{display:none}
  .story{
    flex-shrink:0;width:68px;text-align:center;
  }
  .story-ring{
    width:64px;height:64px;border-radius:50%;
    background:var(--bone-2);
    border:2px solid var(--wine);padding:3px;
    display:grid;place-items:center;
  }
  .story-inner{
    width:100%;height:100%;border-radius:50%;
    display:grid;place-items:center;
    background:var(--bone);
    position:relative;overflow:hidden;
  }
  .story-inner .mini-b{
    width:14px;height:36px;border-radius:40% 40% 3px 3px / 8% 8% 3px 3px;
  }
  .story .n{font-size:10px;margin-top:6px;color:var(--ink-2);letter-spacing:-.01em;font-weight:500}

  /* Product grid 2-col */
  .p-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 18px;
  }
  .p-card{
    background:#fff;border:1px solid var(--line-2);border-radius:14px;
    padding:12px 12px 14px;position:relative;display:flex;flex-direction:column;
  }
  .p-card .p-tag{
    position:absolute;top:10px;left:0;background:var(--wine);color:var(--bone);
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:0 4px 4px 0;z-index:2;
  }
  .p-card .p-fav{
    position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;color:var(--ink-4);z-index:2;
  }
  .p-card .p-fav.on{color:var(--wine)}
  .p-card .p-fav svg{width:15px;height:15px;stroke-width:1.5}
  .p-img{
    aspect-ratio:1/1;display:grid;place-items:center;margin-bottom:8px;
  }
  .p-bottle{
    width:40px;height:110px;border-radius:38% 38% 5px 5px / 8% 8% 5px 5px;
    filter:drop-shadow(-2px 4px 6px rgba(0,0,0,.1));
    position:relative;
  }
  .p-bottle::before{
    content:"";position:absolute;left:50%;top:-14px;transform:translateX(-50%);
    width:12px;height:22px;background:inherit;filter:brightness(.55);border-radius:2px 2px 0 0;
  }
  .p-bottle::after{
    content:"";position:absolute;left:4px;right:4px;top:38px;bottom:12px;
    background:var(--bone);border-radius:2px;
  }
  .p-price{font-size:14px;font-weight:700;margin-bottom:2px;display:flex;gap:6px;align-items:baseline}
  .p-price .was{font-size:11px;color:var(--ink-4);text-decoration:line-through;font-weight:400}
  .p-name{font-size:11px;color:var(--ink-2);line-height:1.3;margin-bottom:8px;min-height:28px}
  .p-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
  .p-ml{font-size:10px;color:var(--ink-3);border:1px solid var(--line);padding:3px 8px;border-radius:5px}
  .p-add{
    width:28px;height:28px;border-radius:50%;background:var(--wine);color:var(--bone);
    display:grid;place-items:center;
  }
  .p-add svg{width:14px;height:14px}

  /* Banner mid */
  .mid-banner{
    margin:0 14px 18px;background:var(--ink);color:var(--bone);
    border-radius:14px;padding:18px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    position:relative;overflow:hidden;
  }
  .mid-banner h4{
    font-family:'Playfair Display',serif;font-size:18px;margin:0 0 4px;line-height:1.05;
  }
  .mid-banner h4 em{color:#e8c5cb;font-style:italic;font-weight:500}
  .mid-banner p{font-size:11px;opacity:.7;margin:0 0 10px}
  .mid-banner .cta{
    display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    padding:6px 12px;background:var(--wine);color:var(--bone);border-radius:999px;
  }
  .mid-banner .deco{
    width:70px;height:70px;border-radius:50%;border:2px solid var(--wine);
    display:grid;place-items:center;flex-shrink:0;
    font-family:'Playfair Display',serif;font-style:italic;
    font-size:22px;font-weight:700;color:#e8c5cb;
  }

  /* ===== CATEGORIES SCREEN ===== */
  .cat-list{padding:4px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cat-card{
    background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:14px;
    display:flex;flex-direction:column;gap:10px;
    position:relative;overflow:hidden;min-height:120px;
  }
  .cat-card .c-disc{
    width:54px;height:54px;border-radius:50%;background:var(--bone-2);
    display:grid;place-items:center;
  }
  .cat-card .c-disc .mini-b{width:14px;height:36px;border-radius:40% 40% 3px 3px / 8% 8% 3px 3px}
  .cat-card h5{font-family:'Playfair Display',serif;font-size:15px;margin:0;font-weight:600}
  .cat-card small{font-size:10px;color:var(--ink-4);letter-spacing:.08em;text-transform:uppercase}
  .cat-card.feat{
    background:var(--wine);color:var(--bone);
    grid-column:span 2;flex-direction:row;align-items:center;
  }
  .cat-card.feat .c-disc{background:rgba(255,255,255,.12)}
  .cat-card.feat small{color:rgba(255,255,255,.7)}

  /* ===== SEARCH SCREEN ===== */
  .search-input{
    margin:6px 14px 14px;background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:11px 16px 11px 40px;font-size:13px;position:relative;display:flex;align-items:center;
  }
  .search-input svg{position:absolute;left:14px;width:14px;height:14px;color:var(--ink-4)}
  .search-input input{flex:1;border:0;background:transparent;outline:none;font-size:13px}

  .recent-title{padding:6px 16px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between}
  .recent-title a{color:var(--wine-2);font-size:10px}
  .recent-list{padding:0 16px}
  .recent-row{
    padding:10px 0;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-2);
  }
  .recent-row svg{width:14px;height:14px;color:var(--ink-4)}
  .recent-row .close{margin-left:auto;color:var(--ink-4)}

  /* ===== CATALOG / PRODUCT LIST ===== */
  .filter-bar{
    display:flex;gap:8px;padding:4px 14px 10px;overflow-x:auto;
  }
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-chip{
    flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    font-size:11px;background:#fff;color:var(--ink-2);
    display:flex;align-items:center;gap:4px;
  }
  .filter-chip.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
  .filter-chip svg{width:11px;height:11px}

  /* ===== PRODUCT DETAIL ===== */
  .pd-top{
    padding:10px 16px;display:flex;align-items:center;gap:10px;
  }
  .pd-back{width:36px;height:36px;border-radius:50%;background:var(--bone-2);display:grid;place-items:center}
  .pd-back svg{width:14px;height:14px}
  .pd-top-right{margin-left:auto;display:flex;gap:6px}

  .pd-image{
    padding:30px 20px;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 50% 50%, var(--wine-wash), transparent 70%);
    margin:0 14px;border-radius:20px;margin-bottom:20px;
  }
  .pd-image .p-bottle{width:90px;height:240px}
  .pd-image .p-bottle::after{top:80px}
  .pd-badge-round{
    position:absolute;top:16px;right:16px;
    width:58px;height:58px;border-radius:50%;
    background:var(--wine);color:var(--bone);
    display:grid;place-items:center;text-align:center;
    font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:14px;
    line-height:1.1;transform:rotate(-10deg);
  }
  .pd-badge-round b{display:block;font-size:18px;font-style:normal;letter-spacing:-.02em}

  .pd-info{padding:0 18px 18px}
  .pd-cat{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--wine);margin-bottom:6px;font-weight:600}
  .pd-name{font-family:'Playfair Display',serif;font-size:24px;line-height:1.1;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
  .pd-name em{color:var(--wine);font-style:italic;font-weight:500}
  .pd-origin{font-size:12px;color:var(--ink-3);margin-bottom:12px}

  .pd-rating{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);
    padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px;
  }
  .pd-rating .stars{color:var(--wine);font-size:13px}

  .pd-notes{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:18px}
  .pd-notes div{display:flex;flex-direction:column;gap:2px}
  .pd-notes small{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4)}
  .pd-notes b{font-size:12px;font-weight:500;color:var(--ink-2)}

  .pd-desc{font-size:12px;color:var(--ink-2);line-height:1.6;margin-bottom:20px}

  .pd-bar{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--bone);border-top:1px solid var(--line);
    padding:12px 16px 16px;display:flex;align-items:center;gap:10px;
  }
  .pd-bar .pd-price{
    font-family:'Playfair Display',serif;font-size:22px;font-weight:700;letter-spacing:-.01em;flex:1;
  }
  .pd-bar .pd-price small{display:block;font-size:9px;color:var(--ink-4);letter-spacing:.16em;text-transform:uppercase;font-family:'Inter',sans-serif;font-weight:500}
  .pd-bar .add-btn{
    background:var(--wine);color:var(--bone);

  .cart-foot{
    background:#fff;border-top:1px solid var(--line);

  .sum-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--ink-2)}
  .sum-row.total{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
  .sum-row.total span:last-child{font-family:'Playfair Display',serif;font-size:20px;font-weight:700}
  .checkout-btn{
    margin-top:10px;width:100%;background:var(--wine);color:var(--bone);
    padding:13px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:8px;

  .checkout-btn svg{width:13px;height:13px}

  .co-step{padding:14px 16px;border-bottom:1px solid var(--line-2)}

  .drawer-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;

  }
  .drawer-overlay.on{opacity:1;pointer-events:auto}
  .drawer{
    position:absolute;top:0;bottom:0;left:0;width:78%;background:var(--bone);

  .drawer-nav{flex:1;overflow-y:auto;padding:10px 0}
  .drawer-nav a{

  .drawer-nav a svg{width:16px;height:16px;color:var(--ink-4)}

  .drawer-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4)}

  /* ===== Notification dot ===== */
  .notif-banner{
    margin:0 14px 12px;padding:10px 14px;border-radius:10px;

    display:flex;align-items:center;gap:8px;

  .notif-banner svg{width:14px;height:14px;flex-shrink:0}
  .notif-banner b{font-weight:600}

  /* ===== Android specific tweaks ===== */
  .android .hamburger{border-radius:50%}
  .android .p-card{border-radius:12px}
  .android .hero-card{border-radius:12px}
  .android .cat-card{border-radius:12px}

  /* ===== Floating cart ===== */
  .floating-cart{
    position:absolute;bottom:78px;right:14px;
    background:var(--ink);color:var(--bone);padding:10px 14px;border-radius:999px;
    font-size:11px;display:flex;align-items:center;gap:8px;font-weight:500;
    box-shadow:0 10px 24px rgba(0,0,0,.2);z-index:10;
  }
  .floating-cart svg{width:13px;height:13px}
  .floating-cart b{color:#fff}
</style>
</head>

    });
  });
</script>
