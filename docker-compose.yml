services:
  db:
    image: postgres:16-alpine
    container_name: eshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: eshop-nest
    command: npm run start:dev
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db

  frontend-customer:
    build: ./frontend-customer
    container_name: eshop-customer
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    volumes:
      - ./frontend-customer:/app
      - /app/node_modules
    depends_on:
      - backend

  frontend-admin:
    build: ./frontend-admin
    container_name: eshop-admin
    command: npm run dev
    ports:
      - "3001:3000"
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    depends_on:
      - backend

  frontend-vue:
    build: ./frontend-vue
    container_name: eshop-vue
    command: npm run dev -- --host 0.0.0.0 --port 3002
    ports:
      - "3002:3002"
    environment:
      VITE_API_URL: http://localhost:4000
      NODE_ENV: development
    volumes:
      - ./frontend-vue:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
