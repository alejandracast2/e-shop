services:
  mongo:
    image: mongo:7
    container_name: e-shop-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: eshop-nest
    command: npm run start:dev
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: ${MONGO_URI}
      DB_NAME: ${DB_NAME}
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo

  frontend-customer:
    build: ./frontend-customer
    container_name: eshop-customer
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    volumes:
      - ./frontend-customer:/app
      - /app/node_modules
    depends_on:
      - backend

  frontend-admin:
    build: ./frontend-admin
    container_name: eshop-admin
    command: npm run dev
    ports:
      - "3001:3000"
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
